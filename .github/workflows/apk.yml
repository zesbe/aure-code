# 在 GitHub 上构建 APK：每个 PR、每次推到 main 都出一个包（在这次运行的 Artifacts 里下载）。
# 推到 main 时用正式钥匙签，能直接覆盖安装正式版。钥匙 CCCODROID_RELEASE_KEY（钥匙 JSON 的 base64）只放在
# environment「apk-release」里，那个环境只放行 main 分支：任何 PR（包括本仓库分支开的、改了这份工作流的）都拿不到它，
# 只能用临时生成的测试钥匙签 —— 能装，但要先卸载正式版（数据会丢），建议装在测试机上。
name: apk

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "devkit/**", "devkit-*", ".github/workflows/devkit.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 网关测试（gateway/tests/，node scripts/test.mjs）：几秒钟跑完；不过就不打包
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"
      - name: 网关测试
        run: node scripts/test.mjs

  build:
    needs: test
    runs-on: ubuntu-24.04
    # 只有 main 上的运行进正式钥匙所在的环境；其余（PR、别的分支手动跑）不进，拿不到钥匙
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'apk-release' || '' }}
    env:
      BUILD_TOOLS: "35.0.0"
      PLATFORM: "android-35"
      NDK: "27.2.12479018"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"

      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" "ndk;$NDK" > /dev/null

      - name: 签名钥匙
        env:
          RELEASE_KEY: ${{ secrets.CCCODROID_RELEASE_KEY }}
          AURE_KS_B64: ${{ secrets.AURE_KS_B64 }}
          AURE_KS_PASS: ${{ secrets.AURE_KS_PASS }}
        run: |
          if [ -n "$AURE_KS_B64" ] && [ -n "$AURE_KS_PASS" ]; then
            # Fork（Aure Code）：固定钥匙，每次构建同一个签名 → 新包能直接覆盖安装旧包（不用卸载、数据不丢）
            printf '%s' "$AURE_KS_B64" | base64 -d > "$RUNNER_TEMP/aure.jks"
            echo "KS=$RUNNER_TEMP/aure.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$AURE_KS_PASS" >> "$GITHUB_ENV"
            echo "SIGNED=aure" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_KEY" ]; then
            printf '%s' "$RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.json"
            echo "KEY=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android \
              -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Aure Code test build" 2> /dev/null
            echo "KS=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
            echo "SIGNED=test" >> "$GITHUB_ENV"
          fi

      - name: 构建
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          export CC_ANDROID="$ANDROID_SDK_ROOT/ndk/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export JAVAC=javac D8="$BT/d8" AAPT2="$BT/aapt2" ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/$PLATFORM/android.jar"
          export SIGN=apksigner APKSIGNER="$BT/apksigner" ZIPALIGN="$BT/zipalign"
          # 每次构建版本号都往上走：versionCode = 1000 + 运行序号（比旧包大才能覆盖安装），versionName = 清单里的基础版本 + 序号。
          # 工具包钉子（devkit-pin.json）不随版本号变，所以覆盖安装后不会重新下载工具包
          BASE_VER=$(sed -n 's/.*android:versionName="\([0-9.]*\)".*/\1/p' android/AndroidManifest.xml | head -1)
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="${BASE_VER}.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          # 双方案：先出 targetSdk 36 的（aurecode-36.apk），再出默认的 28
          TARGET_SDK=36 sh scripts/build.sh && mv dist/aurecode.apk dist/aurecode-36.apk
          sh scripts/build.sh
          rm -f "$RUNNER_TEMP/key.json"
          # 证书指纹：正式包必须是 README 里写的那一张（B7:03…8F:E0），对不上就别出包——
          # 钥匙被意外换掉时不会静默发出别的证书签的「正式包」（审查 v0.5.7 L12）。测试包只打出来看
          EXPECT=b70361595dd3d8d704dd210ed596fc577014ce2272884fb6980bf69623338fe0
          for a in dist/aurecode.apk dist/aurecode-36.apk; do
            got=$("$BT/apksigner" verify --print-certs "$a" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "$a  $got"
            if [ "$SIGNED" = release ] && [ "$got" != "$EXPECT" ]; then echo "::error::$a 的签名证书不是正式钥匙（$got）"; exit 1; fi
          done
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: aure-code-${{ env.VERSION_NAME }}-${{ env.SHORT_SHA }}
          path: |
            dist/aurecode.apk
            dist/aurecode-36.apk
          retention-days: 30
